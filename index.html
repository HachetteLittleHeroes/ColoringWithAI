<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой проект</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="userIdDisplay" style="display:none;"></div>

<div id="answers" class="page">
    <div class="header">Ответы</div>
    <input type="text" id="bookSearch" placeholder="Поиск тома..." oninput="filterBooks()">
    <div id="booksGrid" class="grid"></div>
</div>

<div id="markers" class="page">
    <div class="header">Маркеры</div>
    <div class="category-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>GuangNa</span>
        <span style="color: var(--accent); font-size: 15px;">75 руб./шт.</span>
    </div>
    <input type="text" id="markerSearch" placeholder="Поиск номера..." oninput="filterMarkers()">
    <div id="markersList"></div>
</div>

<div id="cart" class="page">
    <div class="header">Корзина</div>
    <div id="cartList"></div>
    <button id="mainOrderBtn" class="buy-btn rounded-pill" style="display: none;" onclick="checkout()">Оформить заказ</button>
</div>

<div id="mymarkers" class="page">
    <div class="header">Мои маркеры 🎒</div>
    <div id="organizerSection">
        <div class="category-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Мои органайзеры 📦</span>
            <button class="buy-btn" style="width:auto; padding:5px 12px;" onclick="showAddOrganizer()">+ Новый</button>
        </div>
        <div id="organizersList" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;"></div>
    </div>

    <div id="brandDetailView" style="display:none;">
        <button class="buy-btn" style="width:auto; background:var(--secondary);" onclick="closeBrandView()">← Назад</button>
        <h3 id="currentBrandTitle"></h3>
        <input type="text" id="brandSearchInput" placeholder="Поиск..." oninput="filterBrandInventory()">
        <div id="brandInventoryList" class="inventory-grid"></div>
    </div>
    
    <div id="organizerDetailView" style="display:none;">
        <div class="header" id="viewOrgTitle">Органайзер</div>
        <div id="gridContainer" class="organizer-grid"></div>
        <button class="buy-btn" onclick="closeOrganizerView()">Закрыть</button>
    </div>
</div>

<div id="profile" class="page active">
    <div class="header">Профиль</div>
    <div class="profile-hero">
        <div class="avatar-container" onclick="toggleAvatarEditor()">
            <img id="user-avatar" src="https://raw.githubusercontent.com/HachetteLittleHeroes/ColoringWithAI/main/avatars/av2.png">
        </div>
        <div class="profile-info-right">
            <div style="display:flex; align-items:center; gap:8px;">
                <h2 id="displayUsername" onclick="changeNickname()">Без имени</h2>
                <i class="fas fa-pen" onclick="changeNickname()"></i>
            </div>
            <div id="currentStatus" class="profile-status" onclick="openStatusSelect()">Без статуса</div>
        </div>
    </div>

    <div id="avatarEditorBlock" style="display:none;">
        <input type="file" id="customAvatarInput" onchange="handleCustomAvatar(event)">
        <button class="buy-btn" onclick="document.getElementById('customAvatarInput').click()">Загрузить фото</button>
        <div id="avatarPresetsGrid" class="avatar-grid-presets"></div>
    </div>

<div class="balance-card">
    <p style="margin:0; opacity:0.9; font-size: 14px; letter-spacing: 1px; color: white;">ВАШ БАЛАНС</p>
    <div class="balance-amount">
        <span id="userBalance">0</span> 
        <i class="fas fa-book-open gold-book"></i>
    </div>
    
    <div class="balance-btns-container">
        <button class="buy-btn balance-action-btn" onclick="toggleRewards()">
            Потратить ашетики 🎁
        </button>
        <button class="buy-btn balance-action-btn" onclick="toggleEarnAchetiki()">
            Заработать ашетики 💰
        </button>
    </div>
</div>


<div id="aipalette" class="page">
    <div class="header">ИИ Палитра ✨</div>
    <select id="aiSearchBrand">
        <option value="All">Все бренды</option>
        <option value="GuangNa">GuangNa</option>
    </select>
    <label><input type="checkbox" id="aiUseInventoryOnly"> Только мои маркеры</label>
    <input type="file" id="aiInput" accept="image/*" multiple onchange="processAI(event)">
    <button class="buy-btn" onclick="document.getElementById('aiInput').click()">📷 Сфотографировать</button>
    <div id="aiMultipleResultsContainer"></div>
</div>

<div id="nameInputModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3>Новый никнейм</h3>
        <input type="text" id="newNameInput" placeholder="Введите имя...">
        <button class="buy-btn" onclick="saveNewNickname()">Сохранить</button>
        <button class="buy-btn" style="background:var(--gray);" onclick="document.getElementById('nameInputModal').style.display='none'">Отмена</button>
    </div>
</div>

<div id="statusSelectModal" class="modal-overlay" style="display:none;" onclick="closeStatusSelectOutside(event)">
    <div class="modal-content" onclick="event.stopPropagation()"> <h3 style="margin-bottom: 20px; text-align: center;">Выберите статус</h3>
        <div id="statusSelectList" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
            </div>
        <button class="buy-btn" style="background: #007aff; padding: 15px; border-radius: 12px;" onclick="closeStatusSelect()">
            Закрыть
        </button>
    </div>
</div>


<div id="cellManageModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3 id="cellModalTitle">Ячейка</h3>
        <div id="cellMarkerList"></div>
        <button class="buy-btn" onclick="openAddMarkerModal()">+ Добавить маркер</button>
        <button class="buy-btn" style="background:var(--gray);" onclick="closeCellModal()">Закрыть</button>
    </div>
</div>

<nav class="nav">
    <button id="btn-profile" class="nav-btn active" onclick="tab('profile')"><span class="nav-icon">👤</span>Профиль</button>
    <button id="btn-markers" class="nav-btn" onclick="tab('markers')"><span class="nav-icon">🖍️</span>Маркеры</button>
    <button id="btn-answers" class="nav-btn" onclick="tab('answers')"><span class="nav-icon">📚</span>Ответы</button>
    <button id="btn-mymarkers" class="nav-btn" onclick="tab('mymarkers')"><span class="nav-icon">🎒</span>Мои</button>
    <button id="btn-cart" class="nav-btn" onclick="tab('cart')"><span class="nav-icon">🛒</span>Корзина <span id="cartBadge" class="badge" style="display:none">0</span></button>
</nav>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/handlers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
