<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coloring App</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="userIdDisplay" style="display:none;"></div>

<div id="profile" class="page active">
    <div class="profile-header-block">
        <div class="avatar-section">
            <div class="avatar-wrapper" onclick="toggleAvatarEditor()">
                <img id="user-avatar" src="https://raw.githubusercontent.com/HachetteLittleHeroes/ColoringWithAI/main/avatars/av2.png" alt="Avatar">
            </div>
            <div class="profile-meta">
                <h2 id="displayUsername" onclick="changeNickname()">Без имени</h2>
                <div id="currentStatus" class="status-badge" onclick="openStatusSelect()">Новичок</div>
            </div>
        </div>
    </div>

    <div id="avatarEditorBlock" class="expandable-block" style="display:none;">
        <div class="preset-avatars" id="avatarPresets">
            </div>
        <input type="file" id="customAvatarInput" style="display:none;" onchange="handleCustomAvatar(event)">
        <button class="action-btn-secondary" onclick="document.getElementById('customAvatarInput').click()">Установить своё фото</button>
    </div>

    <div class="balance-card">
        <p class="balance-label">ВАШ БАЛАНС</p>
        <div class="balance-main">
            <span id="userBalance">0</span> 
            <i class="fas fa-book-open gold-book"></i>
        </div>
        <div class="balance-controls">
            <button class="balance-btn" onclick="toggleSection('rewards-section')">Потратить ашетики 🎁</button>
            <button class="balance-btn" onclick="toggleSection('earn-section')">Заработать ашетики 💰</button>
        </div>
    </div>

    <div id="rewards-section" class="sub-page-block" style="display:none;">
        <div class="section-header">Товары за ашетики</div>
        <div id="rewardsList" class="reward-grid"></div>
    </div>

    <div id="earn-section" class="sub-page-block" style="display:none;">
        <div class="section-header">Как получить ашетики</div>
        <div id="earnInstructions" class="earn-info"></div>
    </div>

    <div class="tasks-container">
        <div class="section-tab" onclick="toggleTasks()">
            <span>Задания</span>
            <i class="fas fa-chevron-down" id="tasksArrow"></i>
        </div>
        <div id="tasksList" class="collapsible-content" style="display:none;">
            </div>
    </div>

    <div class="showcase-container">
        <div class="section-header">Витрина Топ-3</div>
        <div class="showcase-grid">
            <div class="showcase-slot" onclick="openAchievementInfo(0)" id="slot-0"><i class="fas fa-lock"></i></div>
            <div class="showcase-slot" onclick="openAchievementInfo(1)" id="slot-1"><i class="fas fa-lock"></i></div>
            <div class="showcase-slot" onclick="openAchievementInfo(2)" id="slot-2"><i class="fas fa-lock"></i></div>
        </div>
    </div>
</div>

<div id="markers" class="page">
    <div class="header">Маркеры</div>
    <div class="search-container">
        <input type="text" id="markerSearch" placeholder="Поиск по номеру..." oninput="filterMarkers()">
    </div>
    <div class="brand-section">
        <h3 class="brand-title">GUANGNA</h3>
        <div id="markersList" class="marker-list-container">
            </div>
    </div>
</div>

<div id="answers" class="page">
    <div class="header">Ответы</div>
    <div class="search-container">
        <input type="text" id="bookSearch" placeholder="Найти том..." oninput="filterBooks()">
    </div>
    <div id="booksGrid" class="market-grid">
        </div>
</div>

<div id="aipalette" class="page">
    <div class="header">ИИ Палитра ✨</div>
    <div class="ai-upload-box">
        <div class="upload-area" onclick="document.getElementById('aiInput').click()">
            <i class="fas fa-camera"></i>
            <p>Загрузить фото для определения цвета</p>
        </div>
        <input type="file" id="aiInput" accept="image/*" style="display:none;" onchange="processAI(event)">
        <div id="aiResult" class="ai-result-card" style="display:none;"></div>
    </div>

    <button class="action-btn-main" onclick="openMyCollection()">Мои маркеры и органайзеры 🎒</button>

    <div id="adminAIBlock" class="admin-panel" style="display:none;">
        <h4>Обучение ИИ (Admin)</h4>
        <button class="admin-btn" onclick="startAITraining()">Создать 25 вариаций партии</button>
    </div>
</div>

<div id="cart" class="page">
    <div class="header">Корзина</div>
    <div id="cartItemsList" class="cart-container"></div>
    <div class="cart-footer">
        <div class="cart-total">Итого: <span id="cartTotalSum">0</span> ₽</div>
        <button class="buy-btn" onclick="checkout()">Оформить заказ</button>
    </div>
</div>

<div id="viewer" class="fullscreen-viewer" style="display:none;">
    <button class="viewer-close" onclick="closeViewer()">Назад</button>
    <div id="viewerContent" class="viewer-slider"></div>
</div>

<div id="collectionModal" class="modal-overlay" style="display:none;">
    <div class="modal-content full-modal">
        <button class="close-modal" onclick="closeCollection()">×</button>
        <h3>Моя коллекция</h3>
        <div id="brandStats" class="brand-stats-list"></div>
        <hr>
        <div class="organizer-controls">
            <button onclick="createNewOrganizer()">+ Создать органайзер</button>
        </div>
        <div id="organizersList" class="organizers-grid"></div>
    </div>
</div>

<div id="nameModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3>Как вас звать?</h3>
        <input type="text" id="newNameInput" placeholder="Введите ник...">
        <button class="action-btn-main" onclick="saveNewNickname()">Сохранить</button>
    </div>
</div>

<nav class="nav">
    <button id="btn-profile" class="nav-btn active" onclick="tab('profile')">
        <i class="fas fa-user-circle"></i><span>Профиль</span>
    </button>
    <button id="btn-markers" class="nav-btn" onclick="tab('markers')">
        <i class="fas fa-marker"></i><span>Маркеры</span>
    </button>
    <button id="btn-answers" class="nav-btn" onclick="tab('answers')">
        <i class="fas fa-book"></i><span>Ответы</span>
    </button>
    <button id="btn-aipalette" class="nav-btn" onclick="tab('aipalette')">
        <i class="fas fa-magic"></i><span>ИИ Палитра</span>
    </button>
    <button id="btn-cart" class="nav-btn" onclick="tab('cart')">
        <i class="fas fa-shopping-cart"></i>
        <span>Корзина</span>
        <span id="cartBadge" class="badge" style="display:none;">0</span>
    </button>
</nav>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
