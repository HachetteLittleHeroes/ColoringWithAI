<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой проект</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="userIdDisplay" style="display:none;"></div>

<!-- ================= ОТВЕТЫ ================= -->
<div id="answers" class="page">
    <div class="header">Ответы</div>
    <input type="text" id="bookSearch" placeholder="Поиск тома..." oninput="filterBooks()">
    <div id="booksGrid" class="grid"></div>
</div>

<!-- ================= МАРКЕРЫ ================= -->
<div id="markers" class="page">
    <div class="header">Маркеры</div>
    <div class="category-title" style="display:flex;justify-content:space-between;">
        <span>GuangNa</span>
        <span style="color:var(--accent);">75 руб./шт.</span>
    </div>
    <input type="text" id="markerSearch" placeholder="Поиск номера..." oninput="filterMarkers()">
    <div id="markersList"></div>
</div>

<!-- ================= КОРЗИНА ================= -->
<div id="cart" class="page">
    <div class="header">Корзина</div>
    <div id="cartList"></div>
    <button id="mainOrderBtn" class="buy-btn" style="display:none;" onclick="checkout()">Оформить заказ</button>
</div>

<!-- ================= МОИ МАРКЕРЫ ================= -->
<div id="mymarkers" class="page">
    <div class="header">Мои маркеры 🎒</div>

    <div id="organizerSection">
        <div class="category-title" style="display:flex;justify-content:space-between;">
            <span>Органайзеры</span>
            <button class="buy-btn" onclick="showAddOrganizer()">+ Новый</button>
        </div>
        <div id="organizersList"></div>
    </div>

    <div id="brandDetailView" style="display:none;">
        <button class="buy-btn" onclick="closeBrandView()">← Назад</button>
        <h3 id="currentBrandTitle"></h3>
        <input type="text" id="brandSearchInput" oninput="filterBrandInventory()">
        <div id="brandInventoryList" class="inventory-grid"></div>
    </div>

    <div id="organizerDetailView" style="display:none;">
        <div class="header" id="viewOrgTitle"></div>
        <div id="gridContainer" class="organizer-grid"></div>
        <button class="buy-btn" onclick="closeOrganizerView()">Закрыть</button>
    </div>
</div>

<!-- ================= ПРОФИЛЬ ================= -->
<div id="profile" class="page active">

    <div class="header">Профиль</div>

    <div class="profile-hero">
     <div class="avatar-container" onclick="toggleAvatarEditor()">
    <div class="avatar-preview">
        <img id="user-avatar" src="...">
    </div>
</div>
        </div>

        <div>
            <h2 id="displayUsername" onclick="changeNickname()">Без имени</h2>
            <div id="currentStatus" class="profile-status" onclick="openStatusSelect()">Без статуса</div>
        </div>
    </div>

    <div id="avatarEditorBlock" style="display:none;">
        <input type="file" id="customAvatarInput" onchange="handleCustomAvatar(event)">
        <button class="buy-btn" onclick="document.getElementById('customAvatarInput').click()">Загрузить</button>
        <div id="avatarPresetsGrid"></div>
    </div>

    <div class="balance-card">
        <div class="balance-amount">
            <span id="userBalance">0</span>
        </div>

        <div class="balance-btns-container">
            <button class="buy-btn" onclick="toggleRewards()">Потратить</button>
            <button class="buy-btn" onclick="toggleEarnAchetiki()">Заработать</button>
        </div>
    </div>
<div id="rewards-section" style="display:none;"></div>

<div id="earn-section" style="display:none;"></div>
</div>

<!-- ================= AI ПАЛИТРА ================= -->
<div id="aipalette" class="page">
    <div class="header">ИИ Палитра</div>

    <select id="aiSearchBrand">
        <option value="All">Все</option>
    </select>

    <input type="file" id="aiInput" multiple onchange="processAI(event)">
    <button class="buy-btn" onclick="document.getElementById('aiInput').click()">Фото</button>

    <div id="aiMultipleResultsContainer"></div>
</div>

<!-- ================= НАВИГАЦИЯ ================= -->
<nav class="nav">
    <button id="btn-answers" class="nav-btn" onclick="tab('answers')">
        <span class="nav-icon">📚</span>
        <span class="nav-label">Ответы</span>
    </button>

    <button id="btn-aipalette" class="nav-btn" onclick="tab('aipalette')">
        <span class="nav-icon">🎨</span>
        <span class="nav-label">ИИ палитры</span>
    </button>

    <button id="btn-markers" class="nav-btn" onclick="tab('markers')">
        <span class="nav-icon">🖍️</span>
        <span class="nav-label">Маркеры</span>
    </button>

    <button id="btn-cart" class="nav-btn" onclick="tab('cart')">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">Корзина</span>
        <span id="cartBadge" class="badge" style="display:none">0</span>
    </button>

    <button id="btn-profile" class="nav-btn active" onclick="tab('profile')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Профиль</span>
    </button>
</nav>

<!-- ================= JS ================= -->
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/handlers.js"></script>
<script src="js/app.js"></script>

</body>
</html>
